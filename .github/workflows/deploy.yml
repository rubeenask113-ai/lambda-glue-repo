name: Deploy Lambda Glue Pipeline

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  STAGING_BUCKET: lambda-glue-repo-staging-bucket
  STACK_NAME: lambda-glue-tst
  LAMBDA_KEY: lambda/${{ github.sha }}.zip
  GLUE_KEY: glue/${{ github.sha }}-job.py

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # STEP 1: CHECKOUT CODE
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # STEP 2: DEBUG OIDC CLAIMS
      # ============================================================

      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64').toString()
            );

            console.log('OIDC issuer:', payload.iss);
            console.log('OIDC subject:', payload.sub);
            console.log('OIDC audience:', payload.aud);
            console.log('OIDC repository:', payload.repository);
            console.log('OIDC ref:', payload.ref);


      # ============================================================
      # STEP 3: OIDC AUTHENTICATION
      # ============================================================

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::039473174687:role/GITAWSrole
          role-session-name: github-actions
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # STEP 4: VALIDATE CLOUDFORMATION
      # ============================================================

      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/template.yaml


      # ============================================================
      # STEP 5: PACKAGE LAMBDA
      # ============================================================

      - name: Package Lambda
        run: |
          cd lambda
          zip -r ../lambda-package.zip .


      # ============================================================
      # STEP 6: CREATE STAGING BUCKET IF MISSING
      # ============================================================

      - name: Create staging bucket if missing
        run: |
          if aws s3api head-bucket --bucket "$STAGING_BUCKET" 2>/dev/null; then
            echo "Bucket exists"
          else
            aws s3api create-bucket --bucket "$STAGING_BUCKET"
          fi


      # ============================================================
      # STEP 7: UPLOAD DEPLOYMENT ARTIFACTS
      # ============================================================

      - name: Upload deployment artifacts
        run: |
          aws s3 cp lambda-package.zip "s3://$STAGING_BUCKET/$LAMBDA_KEY"
          aws s3 cp glue/job.py "s3://$STAGING_BUCKET/$GLUE_KEY"


      # ============================================================
      # STEP 8: DEPLOY CLOUDFORMATION STACK
      # ============================================================

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file cloudformation/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION" \
            --parameter-overrides \
              LambdaCodeS3Bucket="$STAGING_BUCKET" \
              LambdaCodeS3Key="$LAMBDA_KEY" \
              GlueJobScriptS3Uri="s3://$STAGING_BUCKET/$GLUE_KEY" \
              RequiredColumns="city,state,country"


      # ============================================================
      # STEP 9: SHOW STACK OUTPUTS
      # ============================================================

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table
