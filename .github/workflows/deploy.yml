name: Deploy to AWS via CloudFormation

on:
  push:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug OIDC claims
        with:
          audience: sts.amazonaws.com

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::039473174687:role/GITAWSrole
          aws-region: us-east-1
          role-session-name: github-actions

      - name: Package Lambda artifact
        run: |
          mkdir -p artifacts
          zip -j artifacts/lambda-package.zip lambda/handler.py

      - name: Create staging bucket if missing
        run: |
          STAGING_BUCKET="lambda-glue-repo-staging-bucket"
          AWS_REGION="us-east-1"

          if aws s3api head-bucket --bucket "$STAGING_BUCKET" 2>/dev/null; then
            echo "Staging bucket already exists"
          else
            echo "Creating staging bucket $STAGING_BUCKET"

            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$STAGING_BUCKET"
            else
              aws s3api create-bucket \
                --bucket "$STAGING_BUCKET" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
          fi

      - name: Upload artifacts to staging bucket
        run: |
          STAGING_BUCKET="lambda-glue-repo-staging-bucket"

          aws s3 cp artifacts/lambda-package.zip \
            s3://${STAGING_BUCKET}/lambda/package.zip

          aws s3 cp glue/job.py \
            s3://${STAGING_BUCKET}/glue/job.py

      - name: Deploy CloudFormation stack
        env:
          STACK_NAME: lambda-glue-stack
        run: |
          STAGING_BUCKET="lambda-glue-repo-staging-bucket"

          aws cloudformation deploy \
            --template-file cloudformation/template.yaml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              LambdaCodeS3Bucket="$STAGING_BUCKET" \
              LambdaCodeS3Key=lambda/package.zip \
              GlueJobScriptS3Uri=s3://${STAGING_BUCKET}/glue/job.py \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset
