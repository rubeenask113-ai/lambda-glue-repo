name: Deploy Lambda Glue Pipeline

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  STAGING_BUCKET: ${{ vars.CFN_STAGING_BUCKET }}
  STACK_NAME: lambda-glue-stack
  LAMBDA_KEY: lambda/${{ github.sha }}.zip
  GLUE_KEY: glue/${{ github.sha }}-job.py

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Debug GitHub OIDC token
      - name: Debug OIDC token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("SUB:", payload.sub);
            console.log("AUD:", payload.aud);

      # Step 3: Configure AWS credentials via OIDC
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::039473174687:role/GITAWSrole
          aws-region: ${{ env.AWS_REGION }}

      # Step 4: Validate CloudFormation template
      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/template.yaml

      # Step 5: Package Lambda
      - name: Package Lambda
        run: |
          cd lambda
          zip -r ../lambda-package.zip handler.py

      # Step 6: Upload deployment artifacts
      - name: Upload deployment artifacts
        run: |
          aws s3 cp lambda-package.zip "s3://$STAGING_BUCKET/$LAMBDA_KEY"
          aws s3 cp glue/job.py "s3://$STAGING_BUCKET/$GLUE_KEY"

      # Step 7: Deploy CloudFormation stack
      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file cloudformation/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              LambdaCodeS3Bucket="$STAGING_BUCKET" \
              LambdaCodeS3Key="$LAMBDA_KEY" \
              GlueJobScriptS3Uri="s3://$STAGING_BUCKET/$GLUE_KEY"

      # Step 8: Show stack outputs
      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" \
            --output table
