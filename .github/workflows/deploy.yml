name: Deploy Lambda Glue Pipeline

on:
  push:
    branches:
      - tst
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  STAGING_BUCKET: lambda-glue-tst-staging-040066346167
  STACK_NAME: lambda-glue-tst
  LAMBDA_KEY: lambda/${{ github.sha }}.zip
  GLUE_KEY: glue/${{ github.sha }}-job.py

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # STEP 1: CHECKOUT CODE
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # STEP 2: DEBUG OIDC CLAIMS
      # ============================================================

      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64').toString()
            );

            console.log('OIDC issuer:', payload.iss);
            console.log('OIDC subject:', payload.sub);
            console.log('OIDC audience:', payload.aud);
            console.log('OIDC repository:', payload.repository);
            console.log('OIDC ref:', payload.ref);


      # ============================================================
      # STEP 3: CONFIGURE AWS CREDENTIALS
      # Shiva's AWS account
      # ============================================================

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::040066346167:role/lambda-glue-dev-github-actions-deploy
          role-session-name: github-actions-rubeena-tst
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # STEP 4: VERIFY AWS ACCOUNT
      # ============================================================

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          echo "Expected AWS account: 040066346167"
          echo "Expected AWS region: $AWS_REGION"


      # ============================================================
      # STEP 5: VALIDATE CLOUDFORMATION
      # ============================================================

      - name: Validate CloudFormation template
        run: |
          set -euo pipefail

          aws cloudformation validate-template \
            --template-body file://cloudformation/template.yaml \
            --region "$AWS_REGION"


      # ============================================================
      # STEP 6: PACKAGE LAMBDA
      # ============================================================

      - name: Package Lambda
        run: |
          set -euo pipefail

          rm -f lambda-package.zip

          cd lambda
          zip -r ../lambda-package.zip .
          cd ..

          ls -lh lambda-package.zip


      # ============================================================
      # STEP 7: CREATE TST STAGING BUCKET IF MISSING
      #
      # IMPORTANT:
      # us-east-1 does NOT accept LocationConstraint=us-east-1.
      # ============================================================

      - name: Create TST staging bucket if missing
        run: |
          set -euo pipefail

          if aws s3api head-bucket \
            --bucket "$STAGING_BUCKET" \
            --region "$AWS_REGION" 2>/dev/null; then

            echo "Staging bucket already exists:"
            echo "$STAGING_BUCKET"

          else

            echo "Creating staging bucket:"
            echo "$STAGING_BUCKET"

            if [ "$AWS_REGION" = "us-east-1" ]; then

              aws s3api create-bucket \
                --bucket "$STAGING_BUCKET" \
                --region "$AWS_REGION"

            else

              aws s3api create-bucket \
                --bucket "$STAGING_BUCKET" \
                --region "$AWS_REGION" \
                --create-bucket-configuration \
                  LocationConstraint="$AWS_REGION"

            fi

          fi


      # ============================================================
      # STEP 8: UPLOAD DEPLOYMENT ARTIFACTS
      # ============================================================

      - name: Upload deployment artifacts
        run: |
          set -euo pipefail

          aws s3 cp \
            lambda-package.zip \
            "s3://${STAGING_BUCKET}/${LAMBDA_KEY}"

          aws s3 cp \
            glue/job.py \
            "s3://${STAGING_BUCKET}/${GLUE_KEY}"

          echo "Lambda uploaded:"
          echo "s3://${STAGING_BUCKET}/${LAMBDA_KEY}"

          echo "Glue script uploaded:"
          echo "s3://${STAGING_BUCKET}/${GLUE_KEY}"


      # ============================================================
      # STEP 9: DEPLOY TST CLOUDFORMATION STACK
      # ============================================================

      - name: Deploy TST CloudFormation stack
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file cloudformation/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION" \
            --parameter-overrides \
              LambdaCodeS3Bucket="$STAGING_BUCKET" \
              LambdaCodeS3Key="$LAMBDA_KEY" \
              GlueJobScriptS3Uri="s3://${STAGING_BUCKET}/${GLUE_KEY}" \
              RequiredColumns="city,state,country"


      # ============================================================
      # STEP 10: SHOW TST STACK OUTPUTS
      # ============================================================

      - name: Show TST stack outputs
        run: |
          set -euo pipefail

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table
