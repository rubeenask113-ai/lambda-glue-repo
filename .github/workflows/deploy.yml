name: Deploy Lambda Glue Pipeline

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  STAGING_BUCKET: lambda-glue-repo-staging-bucket
  STACK_NAME: lambda-glue-stack
  LAMBDA_KEY: lambda/${{ github.sha }}.zip
  GLUE_KEY: glue/${{ github.sha }}-job.py

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ KEEP THIS (correct one)
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::039473174687:role/GITAWSrole
          role-session-name: github-actions
          aws-region: ${{ env.AWS_REGION }}

      # Step 2: Validate CloudFormation template
      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/template.yaml

      # Step 3: Package Lambda
      - name: Package Lambda
        run: |
          cd lambda
          zip -r ../lambda-package.zip .

      # Step 4: Create staging bucket if missing
      - name: Create staging bucket if missing
        run: |
          if aws s3api head-bucket --bucket "$STAGING_BUCKET" 2>/dev/null; then
            echo "Staging bucket exists."
          else
            aws s3api create-bucket --bucket "$STAGING_BUCKET" --region "$AWS_REGION"
          fi

      # Step 5: Upload deployment artifacts
      - name: Upload deployment artifacts
        run: |
          aws s3 cp lambda-package.zip "s3://$STAGING_BUCKET/$LAMBDA_KEY"
          aws s3 cp glue/job.py "s3://$STAGING_BUCKET/$GLUE_KEY"

      # Step 6: Deploy CloudFormation stack
      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file cloudformation/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION" \
            --parameter-overrides \
              LambdaCodeS3Bucket="$STAGING_BUCKET" \
              LambdaCodeS3Key="$LAMBDA_KEY" \
              GlueJobScriptS3Uri="s3://$STAGING_BUCKET/$GLUE_KEY"

      # Step 7: Show stack outputs
      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table