AWSTemplateFormatVersion: '2010-09-09'

Description: AWS CloudFormation stack for an S3-triggered Lambda and Glue ETL pipeline.

Parameters:

  LambdaCodeS3Bucket:
    Type: String

  LambdaCodeS3Key:
    Type: String

  GlueJobScriptS3Uri:
    Type: String

  GlueJobName:
    Type: String
    Default: lambda-glue-tst-job

  RequiredColumns:
    Type: CommaDelimitedList
    Default: city,state,country


Resources:

  # ============================================================
  # LAMBDA EXECUTION ROLE
  # ============================================================

  LambdaExecutionRole:
    Type: AWS::IAM::Role

    Properties:

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: LambdaExecutionPolicy

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              # ------------------------------------------------
              # CLOUDWATCH LOGS
              # ------------------------------------------------

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - arn:aws:logs:*:*:*


              # ------------------------------------------------
              # TST S3 DATA BUCKET ACCESS
              # ------------------------------------------------

              - Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:GetObjectAcl
                  - s3:ListBucket

                Resource:
                  - arn:aws:s3:::lambda-glue-tst-databucket
                  - arn:aws:s3:::lambda-glue-tst-databucket/*


              # ------------------------------------------------
              # START GLUE JOB
              # ------------------------------------------------

              - Effect: Allow

                Action:
                  - glue:StartJobRun
                  - glue:GetJob
                  - glue:GetJobRun

                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:job/${GlueJobName}'


  # ============================================================
  # LAMBDA FUNCTION
  # ============================================================

  GlueEventProcessor:
    Type: AWS::Lambda::Function

    Properties:

      Runtime: python3.11

      Handler: handler.lambda_handler

      Timeout: 300

      Role: !GetAtt LambdaExecutionRole.Arn

      Environment:
        Variables:

          DATA_BUCKET: lambda-glue-tst-databucket

          GLUE_JOB_NAME: !Ref GlueJobName

          REQUIRED_COLUMNS: !Join [",", !Ref RequiredColumns]

      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket

        S3Key: !Ref LambdaCodeS3Key


  # ============================================================
  # ALLOW S3 TO INVOKE LAMBDA
  # ============================================================

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName: !Ref GlueEventProcessor

      Action: lambda:InvokeFunction

      Principal: s3.amazonaws.com

      SourceArn: arn:aws:s3:::lambda-glue-tst-databucket

      SourceAccount: !Ref AWS::AccountId


  # ============================================================
  # TST S3 DATA BUCKET
  # ============================================================

  DataBucket:
    Type: AWS::S3::Bucket

    DependsOn:
      - LambdaInvokePermission

    Properties:

      BucketName: lambda-glue-tst-databucket

      NotificationConfiguration:

        LambdaConfigurations:

          - Event: s3:ObjectCreated:*
            Function: !GetAtt GlueEventProcessor.Arn


  # ============================================================
  # GLUE IAM ROLE
  # ============================================================

  GlueJobRole:
    Type: AWS::IAM::Role

    Properties:

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: GlueJobPolicy

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              # ==================================================
              # TST DATA BUCKET ACCESS
              # ==================================================

              - Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket

                Resource:
                  - arn:aws:s3:::lambda-glue-tst-databucket
                  - arn:aws:s3:::lambda-glue-tst-databucket/*


              # ==================================================
              # STAGING BUCKET ACCESS
              # ==================================================

              - Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket

                Resource:
                  - arn:aws:s3:::lambda-glue-repo-staging-bucket
                  - arn:aws:s3:::lambda-glue-repo-staging-bucket/*


              # ==================================================
              # CLOUDWATCH LOGS
              # ==================================================

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - arn:aws:logs:*:*:*


  # ============================================================
  # GLUE JOB
  # ============================================================

  LambdaToGlueJob:
    Type: AWS::Glue::Job

    Properties:

      Name: !Ref GlueJobName

      Role: !GetAtt GlueJobRole.Arn

      Command:

        Name: glueetl

        PythonVersion: '3'

        ScriptLocation: !Ref GlueJobScriptS3Uri


      DefaultArguments:

        --TempDir: s3://lambda-glue-tst-databucket/temp/

        --job-language: python

        --input_bucket: lambda-glue-tst-databucket

        --input_key: input/location_data.csv

        --output_bucket: lambda-glue-tst-databucket

        --output_prefix: glue-output

        --required_columns: !Join [",", !Ref RequiredColumns]


# ================================================================
# OUTPUTS
# ================================================================

Outputs:

  DataBucketName:
    Description: Name of the TST S3 bucket that receives uploaded files.
    Value: !Ref DataBucket


  LambdaFunctionArn:
    Description: ARN of the TST Lambda function.
    Value: !GetAtt GlueEventProcessor.Arn


  GlueJobNameOutput:
    Description: Name of the TST AWS Glue job.
    Value: !Ref GlueJobName
