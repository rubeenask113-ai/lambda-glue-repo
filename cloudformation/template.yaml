AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Lambda Glue Pipeline - S3 file upload triggers Lambda,
  Lambda validates columns and starts Glue job,
  Glue partitions data by city, state and country.

Resources:

  # ============================================================
  # 1. DATA S3 BUCKET
  # ============================================================

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-databucket'
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt LambdaFunction.Arn

  # ============================================================
  # 2. LAMBDA PERMISSION FOR S3 TRIGGER
  # ============================================================

  LambdaS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt DataBucket.Arn
      SourceAccount: !Ref AWS::AccountId

  # ============================================================
  # 3. LAMBDA EXECUTION ROLE
  # ============================================================

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-LambdaExecutionRole'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: LambdaPipelinePolicy

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              # Lambda CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - arn:aws:logs:*:*:*

              # Read files from data bucket
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/*'

              # Start Glue job
              - Effect: Allow
                Action:
                  - glue:StartJobRun
                Resource:
                  - !GetAtt GlueJob.Arn


  # ============================================================
  # 4. LAMBDA FUNCTION
  # ============================================================

  LambdaFunction:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub '${AWS::StackName}-LambdaFunction'

      Runtime: python3.14

      Handler: lambda_function.lambda_handler

      Role: !GetAtt LambdaExecutionRole.Arn

      Timeout: 60

      MemorySize: 256

      Environment:
        Variables:
          GLUE_JOB_NAME: !Ref GlueJob

      Code:
        S3Bucket: lambda-glue-repo-staging-bucket
        S3Key: lambda/lambda_function.zip


  # ============================================================
  # 5. GLUE IAM ROLE
  # ============================================================

  GlueJobRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub '${AWS::StackName}-GlueJobRole'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - glue.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        # ======================================================
        # GLUE POLICY
        # ======================================================

        - PolicyName: GlueJobPolicy

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              # ------------------------------------------------
              # DATA BUCKET ACCESS
              # ------------------------------------------------

              - Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket

                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/*'


              # ------------------------------------------------
              # STAGING BUCKET ACCESS
              #
              # IMPORTANT:
              # Glue downloads its job.py from this bucket.
              # ------------------------------------------------

              - Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket

                Resource:
                  - arn:aws:s3:::lambda-glue-repo-staging-bucket
                  - arn:aws:s3:::lambda-glue-repo-staging-bucket/*


              # ------------------------------------------------
              # CLOUDWATCH LOGS
              # ------------------------------------------------

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - arn:aws:logs:*:*:*


              # ------------------------------------------------
              # GLUE SERVICE PERMISSIONS
              # ------------------------------------------------

              - Effect: Allow

                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:CreateDatabase
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:GetJob
                  - glue:GetJobs
                  - glue:GetJobRun
                  - glue:GetJobRuns

                Resource:
                  - '*'


  # ============================================================
  # 6. GLUE JOB
  # ============================================================

  GlueJob:
    Type: AWS::Glue::Job

    Properties:
      Name: !Sub '${AWS::StackName}-GlueJob'

      Role: !GetAtt GlueJobRole.Arn

      GlueVersion: '4.0'

      NumberOfWorkers: 2

      WorkerType: G.1X

      Command:
        Name: glueetl

        PythonVersion: '3'

        ScriptLocation: !Sub >
          s3://lambda-glue-repo-staging-bucket/glue/${AWS::StackId}-job.py

      DefaultArguments:

        '--job-language': python

        '--enable-continuous-cloudwatch-log': 'true'

        '--enable-spark-ui': 'true'

        '--enable-metrics': 'true'

        '--enable-job-insights': 'true'

        '--TempDir': !Sub 's3://${DataBucket}/temp/'

        '--input_path': !Sub 's3://${DataBucket}/input/'

        '--output_path': !Sub 's3://${DataBucket}/output/'

      ExecutionProperty:
        MaxConcurrentRuns: 1

      MaxRetries: 0

      Timeout: 30


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:

  DataBucketName:
    Description: Data S3 bucket
    Value: !Ref DataBucket

  LambdaFunctionName:
    Description: Lambda function
    Value: !Ref LambdaFunction

  GlueJobName:
    Description: Glue job
    Value: !Ref GlueJob

  GlueJobRole:
    Description: Glue IAM execution role
    Value: !Ref GlueJobRole
